# ClearForge M1 cleanup-rule catalog (human-review surface).
# The executed truth lives compiled in native/ClearForge.Windows/DefaultRules.cs;
# any change here MUST be mirrored there and covered by tests. Rules are
# versioned; never mutate an existing rule id — bump `version` for changes.
#
# `include_patterns` (optional): filename-only Win32 globs applied to files
# inside the root — it can only narrow a rule, never widen it past its root.

catalog_version: 1
rules:
  - id: user-temp-expired-files
    version: 1
    category: temporary-files
    scope: current-user
    root: user-temp                 # resolves via trusted root registry only
    minimum_age_hours: 24
    risk: low
    requires_confirmation: true
    action: quarantine
    max_files_per_scan: 50000
    exclude_locked: true
    follow_reparse_points: false

  - id: user-crash-dumps
    version: 1
    category: crash-dumps
    scope: current-user
    root: user-crash-dumps          # %LOCALAPPDATA%\CrashDumps when present
    minimum_age_hours: 24
    risk: medium
    requires_confirmation: true
    action: quarantine
    max_files_per_scan: 10000
    exclude_locked: true
    follow_reparse_points: false

  # --- M8.2 categories -----------------------------------------------------

  - id: user-thumbnail-cache
    version: 1
    category: thumbnail-cache
    scope: current-user
    root: user-thumbnail-cache      # %LOCALAPPDATA%\Microsoft\Windows\Explorer
    minimum_age_hours: 24
    risk: low
    requires_confirmation: true
    action: quarantine
    max_files_per_scan: 10000
    exclude_locked: true
    follow_reparse_points: false
    include_patterns:               # Explorer regenerates these on demand
      - "thumbcache_*.db"
      - "iconcache_*.db"

