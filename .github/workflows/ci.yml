name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dotnet:
    name: dotnet
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Restore + build + test engine
        run: dotnet test native/ClearForge.sln --nologo

  flutter:
    name: flutter
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Build engine (required by live-pipe tests)
        run: dotnet build native/ClearForge.sln --nologo
      - name: Dependencies
        working-directory: apps/desktop_flutter
        run: flutter pub get
      - name: Analyze
        working-directory: apps/desktop_flutter
        run: flutter analyze
      - name: Unit tests
        working-directory: apps/desktop_flutter
        run: flutter test
      - name: Windows debug build
        working-directory: apps/desktop_flutter
        run: flutter build windows --debug

  m44:
    name: m44-integration
    runs-on: windows-latest
    needs: [dotnet, flutter]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Build engine (the workflow test spawns the real host)
        run: dotnet build native/ClearForge.sln --nologo
      - name: Isolated M44 GUI workflow test (test-owned TEMP)
        working-directory: apps/desktop_flutter
        shell: pwsh
        run: |
          # TEMP must share a volume with %LOCALAPPDATA%: the engine's
          # quarantine is same-volume-only and github.workspace lives on D:
          # while LocalAppData is on C: — a workspace TEMP would make every
          # fixture cross_volume_refused.
          $isolated = Join-Path $env:USERPROFILE 'cf-m44-ci'
          New-Item -ItemType Directory -Force $isolated | Out-Null
          $env:TEMP = $isolated
          $env:TMP = $isolated
          flutter config --enable-windows-desktop
          flutter pub get
          flutter test integration_test/m44_verify_test.dart -d windows
